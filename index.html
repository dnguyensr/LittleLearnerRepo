<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Learner Keys</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header id="top-bar">
        <div id="title-block">
            <h1 id="app-title">🎹 Little Learner Keys</h1>
            <p id="tagline">The marginally educational keyboard smasher</p>
        </div>
        <div class="top-buttons">
            <button id="keyboard-btn" type="button" class="top-btn" aria-pressed="false" aria-label="Toggle on-screen keyboard">⌨️<span class="btn-label"> Keyboard</span></button>
            <button id="fullscreen-btn" type="button" class="top-btn" aria-label="Fullscreen">🖥️<span class="btn-label"> Fullscreen</span></button>
            <button id="settings-btn" type="button" class="top-btn" aria-label="Parent settings (press and hold)">⚙️</button>
        </div>
    </header>

    <main id="play-area">
        <div class="key-history" id="key-history"></div>
        <!-- 🏆 not ⭐: the badge sits inside the play area, and ⭐ is a countable
             subject (see js/data/decor.js). -->
        <div id="score-display">🏆 Score: <span id="word-count">0</span></div>
        <div id="key-display">Tap or press a key!</div>
        <div id="word-container">
            <div id="word-emoji"></div>
            <div id="word-prompt">Type this word:</div>
            <div id="target-word"></div>
        </div>
        <div id="math-container">
            <div id="math-question"></div>
            <div id="math-emojis"></div>
            <div id="math-equation"></div>
            <div id="math-answer-display">?</div>
            <button id="math-speak-btn" type="button" class="speak-btn" aria-label="Read the problem aloud">🔊</button>
        </div>
        <div id="mathlab-container">
            <div id="mathlab-question"></div>
            <div id="mathlab-workspace"></div>
            <div id="mathlab-entry">
                <div id="mathlab-prompt"></div>
                <div id="mathlab-answer-display">?</div>
                <button id="mathlab-speak-btn" type="button" class="speak-btn" aria-label="Read the problem aloud">🔊</button>
            </div>
        </div>
        <div id="piano-container">
            <div id="piano"></div>
        </div>
        <div id="letters-container">
            <div id="letter-display">ABC</div>
            <div id="letter-example">Press a letter!</div>
        </div>
        <div id="numbers-container">
            <div id="number-display">123</div>
            <div id="number-objects"></div>
        </div>
    </main>

    <p id="instructions">Tap the screen or smash the keyboard! 🎉</p>

    <div id="osk" aria-hidden="true"></div>

    <div id="settings-panel" hidden>
        <div id="settings-card" role="dialog" aria-label="Parent settings">
            <h2>Grown-Ups Only 🔒</h2>
            <p class="settings-note">Opened by holding the ⚙️ button.</p>
            <label class="settings-row"><input type="checkbox" id="set-speech"> Speech sounds</label>
            <p class="settings-note" id="voice-readout">Voice: —</p>
            <label class="settings-row"><input type="checkbox" id="set-phonics"> Letter sounds (phonics) instead of names</label>
            <label class="settings-row">Math level
                <select id="set-math-tier">
                    <option value="auto">Auto (grows with practice)</option>
                    <option value="1">1 — Counting</option>
                    <option value="2">2 — Adding to 10</option>
                    <option value="3">3 — Taking away</option>
                    <option value="4">4 — Big kid math</option>
                </select>
            </label>
            <label class="settings-row"><input type="checkbox" id="set-beta-modes"> Show beta modes 🧪</label>
            <div id="beta-settings" hidden>
                <label class="settings-row">Math Lab method
                    <select id="set-math-method">
                        <option value="classical">Classical</option>
                        <option value="commoncore">Common Core</option>
                        <option value="singapore">Singapore</option>
                        <option value="mix">Mix it up</option>
                    </select>
                </label>
                <div class="settings-row" id="mathlab-progress-row">
                    <span>Progress: <strong id="mathlab-progress-label"></strong></span>
                    <button id="mathlab-progress-reset" type="button" class="reset-btn">Start over</button>
                </div>
                <label class="settings-row">Math Lab stage
                    <select id="set-mathlab-level">
                        <option value="auto">Auto (grows with practice)</option>
                        <option value="counting">Counting</option>
                        <option value="adding10">Adding to 10</option>
                        <option value="subtracting10">Taking away to 10</option>
                        <option value="teens">Teen numbers</option>
                        <option value="twodigit">Two-digit math</option>
                    </select>
                </label>
                <details id="voice-list-row">
                    <summary>Voices on this device</summary>
                    <ul id="voice-list"></ul>
                </details>
            </div>
            <button id="settings-close" type="button" class="top-btn">Done</button>
        </div>
    </div>

    <!-- Browsers refuse to load ES modules over file:// (CORS), so opening this
         file directly gives a blank page and a console error. Say so in the page
         instead, since that is exactly when nobody is looking at the console. -->
    <script>
        if (location.protocol === 'file:') {
            document.addEventListener('DOMContentLoaded', function () {
                document.body.innerHTML = '<div id="file-protocol-help">'
                    + '<h1>🎹 Almost there!</h1>'
                    + '<p>Little Learner Keys needs a web server. Browsers block ES modules '
                    + 'opened straight from a <code>file://</code> path, so double-clicking '
                    + '<code>index.html</code> cannot work.</p>'
                    + '<p>From the repo root, run:</p>'
                    + '<pre>npm run serve</pre>'
                    + '<p>then open <a href="http://localhost:8123/">http://localhost:8123/</a></p>'
                    + '</div>';
            });
        }
    </script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
