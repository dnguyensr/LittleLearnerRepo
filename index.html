<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Learner Keys</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header id="top-bar">
        <div id="title-block">
            <h1 id="app-title">🎹 Little Learner Keys</h1>
            <p id="tagline">The marginally educational keyboard smasher</p>
        </div>
        <div class="top-buttons">
            <button id="keyboard-btn" type="button" class="top-btn" aria-pressed="false" aria-label="Toggle on-screen keyboard">⌨️<span class="btn-label"> Keyboard</span></button>
            <button id="fullscreen-btn" type="button" class="top-btn" aria-label="Fullscreen">🖥️<span class="btn-label"> Fullscreen</span></button>
        </div>
    </header>

    <main id="play-area">
        <div class="key-history" id="key-history"></div>
        <div id="score-display">⭐ Score: <span id="word-count">0</span></div>
        <div id="key-display">Tap or press a key!</div>
        <div id="word-container">
            <div id="word-emoji"></div>
            <div id="word-prompt">Type this word:</div>
            <div id="target-word"></div>
        </div>
        <div id="math-container">
            <div id="math-question"></div>
            <div id="math-emojis"></div>
            <div id="math-answer-display">?</div>
        </div>
    </main>

    <p id="instructions">Tap the screen or smash the keyboard! 🎉</p>

    <div id="osk" aria-hidden="true"></div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
